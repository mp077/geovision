services:
  # GeoVision AI — Unified Full-Stack Service (FastAPI + React SPA)
  - type: web
    name: geovision-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
